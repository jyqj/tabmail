  /api/v1/admin/users/{id}:
    patch:
      tags:
      - Admin
      summary: Update a user (role, active status, display name)
      operationId: updateUser
      description: Accepts one JSON object of at most 64 KiB, including trailing whitespace. Omitted or null member fields are unchanged; an explicit empty display name is retained. Invalid input is rejected before the member mutation.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: [string, 'null']
                  enum:
                  - super_admin
                  - admin
                  - user
                  - null
                is_active:
                  type: [boolean, 'null']
                display_name:
                  type: [string, 'null']
                  maxLength: 255
                  description: Exact text is retained, including whitespace. NUL characters are forbidden. Null leaves the display name unchanged.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid JSON, request over 64 KiB, invalid role, or display name outside the text contract
        '403':
          description: The current administrator cannot manage this member or requested role
        '409':
          description: Member lifecycle guard refused the change, or a legacy permission_profile_id field requires the versioned permission editor
        '404':
          description: User not found

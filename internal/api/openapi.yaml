    SubmissionCapabilities:
      type: object
      additionalProperties: false
      description: Current interaction hints only; each action rechecks server-side authority.
        view_content is the current content-read verdict, not an indication that this receipt
        contains content or was redacted. Content also requires a live durable content item.
        False view_content never turns an authorized receipt into a content response. Retry
        hints may conservatively degrade to false with unknown reason, including list views;
        they never substitute for actual retry admission or current sender authority.
      required: [view_content, retry, retry_block_reason]
      properties:
        view_content: {type: boolean}
        retry: {type: boolean}
        retry_block_reason:
          type: string
          enum: ['', delivery_uncertain, state_not_retryable, sender_authority, unknown]
    SubmissionRecipient:
      type: object
      required: [address, state]
      properties:
        address: {type: string}
        state: {type: string}
    SubmissionContent:
      type: object
      additionalProperties: false
      description: Independent current sender-mailbox read authority AND live durable sent content
        are required on every request. Historical submitter/admin status and receipt visibility
        do not bypass revoked read rights or expired/purged content. Structured BCC appears only
        here, never in ordinary receipts or Bcc headers. complete with bcc [] means known empty;
        legacy_unknown with bcc null means unrecoverable original structured recipients, not empty.
      required: [id, subject, from, to, bcc, recipient_completeness, created_at, content_redacted]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        from: {type: string}
        to: {type: array, items: {type: string}}
        cc: {type: array, items: {type: string}}
        bcc:
          type: [array, 'null']
          items: {type: string}
        recipient_completeness: {type: string, enum: [complete, legacy_unknown]}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Wire-safe display-filtered custom headers; never a Bcc header or raw MIME.
        text_body: {type: string}
        html_body: {type: string}
        created_at: {type: string, format: date-time}
        content_redacted: {type: boolean, enum: [false]}
      oneOf:
      - properties:
          recipient_completeness: {enum: [complete]}
          bcc: {type: array, items: {type: string}}
      - properties:
          recipient_completeness: {enum: [legacy_unknown]}
          bcc: {type: 'null'}
    SubmissionAttachment:
      type: object
      required: [id, filename, content_type, size, state]
      properties:
        id: {type: string, format: uuid}
        filename: {type: string}
        content_type: {type: string}
        size: {type: integer}
        state: {type: string}

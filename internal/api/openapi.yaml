      description: List all send-as grants for a specific send identity.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Send identity ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SendAsGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Grants
      summary: Create a send-as grant
      operationId: createSendAsGrant
      description: Grant a user or API key permission to send as a specific identity.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Send identity ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSendAsGrantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SendAsGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/send-identities/{id}/grants/{grantId}:
    delete:
      tags:
      - Grants
      summary: Delete a send-as grant
      operationId: deleteSendAsGrant
      description: Remove a send-as grant from a send identity.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Send identity ID
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Grant ID
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/outbound:
    get:
      tags: [Sending]
      summary: List ordinary outbound receipts
      operationId: listOutboundJobs
      description: Current authorized metadata-only receipts. API keys require send:read.
      security:
      - BearerAuth: []
      - APIKey: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated ordinary receipts with no content or protocol diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundReceiptListResponse'
  /api/v1/outbound/{id}:
    get:
      tags: [Sending]
      summary: Get ordinary outbound receipt
      operationId: getOutboundJob
      description: Current authorized metadata-only receipt. API keys require send:read.
      security:
      - BearerAuth: []
      - APIKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Ordinary receipt, wrapped in data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundReceiptResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/outbound/{id}/attempts:
    get:
      tags: [Sending]
      summary: Get safe outbound attempt aggregate
      operationId: listOutboundAttempts
      description: Returns the same ordinary receipt with attempt_count and complete-ledger progress,
        not individual attempts, remote targets or SMTP diagnostics. API keys require send:read.
      security:
      - BearerAuth: []
      - APIKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Ordinary receipt, not an attempt array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundReceiptResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/outbound/{id}/retry:
    post:
      tags: [Sending]
      summary: Retry an authorized failed or dead outbound job
      operationId: retryOutboundJob
      description: Revalidates current principal and sender authority before atomic retry.
        Read or receipt visibility alone cannot authorize retry. API keys require send:write.
        After commit, unavailable display authority yields a minimal unknown-progress receipt,
        not a failed command response encouraging duplicate delivery.
      security:
      - BearerAuth: []
      - APIKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Committed retry receipt; local requeue is not delivery confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Retry rejected because state changed or delivery is uncertain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/admin/domains:
    get:
      tags:
      - Admin
      summary: List all domain resources
      operationId: adminListDomains
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainZone'
  /api/v1/admin/permissions:
    get:
      tags:
      - Permissions
      summary: List all permission profiles
      operationId: listPermissionProfiles
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionProfile'
    post:
      tags:
      - Permissions
      summary: Create permission profile
      operationId: createPermissionProfile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
                can_send:
                  type: boolean
                  default: false
                daily_send_quota:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                daily_receive_quota:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                max_mailboxes:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                max_domains:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                allowed_zone_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  nullable: true
                  description: null = all zones allowed
                can_create_domains:
                  type: boolean
                  default: true
                can_create_routes:
                  type: boolean
                  default: true
                can_create_api_keys:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Profile name already exists
  /api/v1/admin/permissions/{id}:
    patch:
      tags:
      - Permissions
      summary: Update permission profile
      operationId: updatePermissionProfile
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionProfileUpdateCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionProfile'
        '400':
          description: Invalid profile patch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '403':
          description: Unauthorized profile scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '409':
          description: Missing or stale revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '500':
          description: Internal error; rollback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
      description: Requires observed expected_revision; missing or stale revision returns
        409, never unversioned overwrite.
    delete:
      tags:
      - Permissions
      summary: Delete profile with confirmed impact and revision
      operationId: deletePermissionProfile
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          not:
            const: 00000000-0000-0000-0000-000000000000
      responses:
        '204':
          description: Deleted after exact impact confirmation and CAS
        '400':
          description: Malformed body or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionEditorError'
        '403':

openapi: 3.1.0
info:
  title: TabMail API
  version: '3.0'
  description: Company browser email with personal/shared mailboxes, independent read/organize/send-as grants, employee activation,
    immutable administrator templates, durable recipient delivery, drafts and recoverable deletion. Company production mode
    disables public registration, standalone mailbox tokens and automatic unknown recipient provisioning. Legacy platform
    routes remain for controlled compatibility; an administrator role alone does not grant message content access. All queued/accepted
    responses describe local acceptance or next-hop acceptance, not inbox delivery or reading. See docs/company-mail/RELEASE-R3.md
    for deployment and rollback requirements.
servers:
- url: /
  description: Current host
tags:
- name: Auth
  description: Authentication and user session management
- name: Domains
  description: Domain zone management
- name: Domain Routes
  description: Routing rules for domain zones
- name: Mailboxes
  description: Mailbox lifecycle management
- name: Messages
  description: Message retrieval and management
- name: Sending
  description: Outbound email sending API
- name: Permissions
  description: Permission profile management (admin only)
- name: Admin
  description: Administrative operations
- name: Grants
  description: Mailbox grants, zone grants, send identities, and send-as grants
- name: System
  description: Health, metrics, and documentation
security:
- {}
- APIKey: []
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Tenant API key
    MailboxToken:
      type: http
      scheme: bearer
      bearerFormat: TabMail-Mailbox-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /auth/login
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CONFLICT
              - RATE_LIMITED
              - QUOTA_EXCEEDED
              - DOMAIN_NOT_VERIFIED
              - SEND_NOT_ALLOWED
              - INTERNAL
            message:
              type: string
    Meta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        max_domains:
          type: integer
        max_mailboxes_per_domain:
          type: integer
        max_messages_per_mailbox:
          type: integer
        max_message_bytes:
          type: integer
        retention_hours:
          type: integer
        rpm_limit:
          type: integer
        daily_quota:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan_id:
          type: string
          format: uuid
        is_super:
          type: boolean
        created_at:
          type: string
          format: date-time
    TenantOverride:
      type: object
      properties:
        max_domains:
          type: integer
          nullable: true
        max_mailboxes_per_domain:
          type: integer
          nullable: true
        max_messages_per_mailbox:
          type: integer
          nullable: true
        max_message_bytes:
          type: integer
          nullable: true
        retention_hours:
          type: integer
          nullable: true
        rpm_limit:
          type: integer
          nullable: true
        daily_quota:
          type: integer
          nullable: true
    EffectiveConfig:
      type: object
      properties:
        max_domains:
          type: integer
        max_mailboxes_per_domain:
          type: integer
        max_messages_per_mailbox:
          type: integer
        max_message_bytes:
          type: integer
        retention_hours:
          type: integer
        rpm_limit:
          type: integer
        daily_quota:
          type: integer
    DomainZone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        parent_zone_id:
          type: string
          format: uuid
          nullable: true
        domain:
          type: string
        visibility:
          type: string
          enum:
          - private
          - authenticated
          - public
        allow_random_subdomains:
          type: boolean
        is_verified:
          type: boolean
        mx_verified:
          type: boolean
        txt_record:
          type: string
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          nullable: true
    DomainRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        route_type:
          type: string
          enum:
          - exact
          - wildcard
          - deep_wildcard
          - sequence
        match_value:
          type: string
        range_start:
          type: integer
          nullable: true
        range_end:
          type: integer
          nullable: true
        auto_create_mailbox:
          type: boolean
        retention_hours_override:
          type: integer
          nullable: true
        access_mode_default:
          type: string
          enum:
          - public
          - token
          - api_key
        created_at:
          type: string
          format: date-time
    Mailbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        owner_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Personal mailbox owner; explicit grants authorize shared access
        local_part:
          type: string
        resolved_domain:
          type: string
        full_address:
          type: string
        access_mode:
          type: string
          enum:
          - public
          - token
          - api_key
        retention_hours_override:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        send_policy:
          type: string
          enum:
          - free
          - template_required
          - disabled
          description: Effective send policy, COALESCE(mailbox override, company default).
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        sender:
          type: string
        recipients:
          type: array
          items:
            type: string
        subject:
          type: string
        size:
          type: integer
        seen:
          type: boolean
        starred:
          type: boolean
          description: Per-user flag merged from message_user_states; legacy mailbox paths report false
        headers:
          type: object
        received_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: NULL means permanent retention; owner mailboxes do not inherit temporary-plan TTL
        otp_code:
          type: string
          description: Omitted when content access is redacted
        otp_confidence:
          type: number
    MessageDetail:
      allOf:
      - $ref: '#/components/schemas/Message'
      - type: object
        properties:
          text_body:
            type: string
          html_body:
            type: string
    Submission:
      type: object
      description: Employee-facing projection of an outbound submission; queue
        internals (attempts, lease, SMTP responses, delivery tokens) are excluded.
      properties:
        id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        from:
          type: string
        subject:
          type: string
        recipients:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              state:
                type: string
                enum: [pending, accepted, temporary, permanent, uncertain]
        status:
          type: string
          enum: [submitted, waiting, sending, partially_accepted, accepted, needs_attention]
        template_version_id:
          type:
          - string
          - 'null'
          format: uuid
        draft_consumed:
          type: boolean
        attachment_count:
          type: integer
        created_at:
          type: string
          format: date-time
        content_redacted:
          type: boolean
        delivery_uncertain:
          type: boolean
    APIKeyScope:
      type: string
      enum:
      - domains:read
      - domains:write
      - routes:read
      - routes:write
      - mailboxes:read
      - mailboxes:write
      - messages:read
      - messages:write
      - send:read
      - send:write
    APIKeyCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Full key (shown only once)
        key_prefix:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyScope'
        created_at:
          type: string
          format: date-time
    MailboxTokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    SMTPMetrics:
      type: object
      properties:
        sessions_opened:
          type: integer
        sessions_active:
          type: integer
        recipients_accepted:
          type: integer
        recipients_rejected:
          type: integer
        messages_accepted:
          type: integer
        messages_rejected:
          type: integer
        deliveries_succeeded:
          type: integer
        deliveries_failed:
          type: integer
        bytes_received:
          type: integer
    WebhookMetrics:
      type: object
      properties:
        enabled:
          type: boolean
        configured:
          type: integer
        queued:
          type: integer
        delivered:
          type: integer
        failed:
          type: integer
    RealtimeMetrics:
      type: object
      properties:
        subscribers_current:
          type: integer
        events_published:
          type: integer
    MetricPoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
        smtp_accepted:
          type: integer
        smtp_rejected:
          type: integer
        deliveries_ok:
          type: integer
        deliveries_failed:
          type: integer
        webhooks_delivered:
          type: integer
        webhooks_failed:
          type: integer
        realtime_published:
          type: integer
    DeliveryStats:
      type: object
      properties:
        key:
          type: string
        accepted:
          type: integer
        rejected:
          type: integer
        deliveries_ok:
          type: integer
        deliveries_failed:
          type: integer
    DeadLetter:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        event_type:
          type: string
        payload:
          type: object
        attempts:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        last_tried_at:
          type: string
          format: date-time
    SMTPPolicy:
      type: object
      properties:
        default_accept:
          type: boolean
        accept_domains:
          type: array
          items:
            type: string
        reject_domains:
          type: array
          items:
            type: string
        default_store:
          type: boolean
        store_domains:
          type: array
          items:
            type: string
        discard_domains:
          type: array
          items:
            type: string
        reject_origin_domains:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    MonitorEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        mailbox:
          type: string
        message_id:
          type: string
        sender:
          type: string
        subject:
          type: string
        size:
          type: integer
        at:
          type: string
          format: date-time
    MetricsSnapshot:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
        smtp:
          $ref: '#/components/schemas/SMTPMetrics'
        webhooks:
          $ref: '#/components/schemas/WebhookMetrics'
        realtime:
          $ref: '#/components/schemas/RealtimeMetrics'
        time_series:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
    SystemStats:
      type: object
      properties:
        tenants_count:
          type: integer
        plans_count:
          type: integer
        domains_count:
          type: integer
        mailboxes_count:
          type: integer
        messages_count:
          type: integer
        metrics:
          $ref: '#/components/schemas/MetricsSnapshot'
        recent_audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        tenant_delivery:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStats'
        mailbox_delivery:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStats'
        dead_letters:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetter'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
          - user
        is_active:
          type: boolean
        permission_profile_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
    IngestJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        remote_ip:
          type: string
        mail_from:
          type: string
        recipients:
          type: array
          items:
            type: string
        state:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        next_attempt_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        url:
          type: string
        event_type:
          type: string
        payload:
          type: object
        state:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        next_attempt_at:
          type: string
          format: date-time
        last_tried_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SystemSetting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        description:
          type: string
        updated_at:
          type: string
          format: date-time
    AdminInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        invite_code:
          type: string
        expires_at:
          type: string
          format: date-time
    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          example: <uuid@mail.example.com>
        state:
          $ref: '#/components/schemas/OutboundState'
        created_at:
          type: string
          format: date-time
    OutboundState:
      type: string
      enum:
      - pending
      - processing
      - sent
      - retry
      - failed
      - dead
    OutboundJob:
      type: object
      properties:
        content_redacted:
          type: boolean
          description: Content and BCC have been removed for a metadata-only viewer.
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        mail_from:
          type: string
        rcpt_to:
          type: array
          items:
            type: string
        subject:
          type: string
        delivered_domains:
          type: array
          items:
            type: string
          description: Domains accepted by the next hop; normal retries skip these domains
        in_flight_domain:
          type: string
          description: Nonempty on a failed job means acceptance is uncertain and blind retry is forbidden
        state:
          $ref: '#/components/schemas/OutboundState'
        attempts:
          type: integer
        max_attempts:
          type: integer
        last_error:
          type: string
        smtp_code:
          type: integer
        smtp_response:
          type: string
        message_id_header:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PermissionProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        can_send:
          type: boolean
        daily_send_quota:
          type: integer
          description: 0 = unlimited
        daily_receive_quota:
          type: integer
          description: 0 = unlimited
        max_mailboxes:
          type: integer
          description: 0 = unlimited
        max_domains:
          type: integer
          description: 0 = unlimited
        allowed_zone_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: null = all zones allowed
        can_create_domains:
          type: boolean
        can_create_routes:
          type: boolean
        can_create_api_keys:
          type: boolean
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EffectivePermission:
      type: object
      properties:
        can_send:
          type: boolean
        daily_send_quota:
          type: integer
        daily_receive_quota:
          type: integer
        max_mailboxes:
          type: integer
        max_domains:
          type: integer
        allowed_zone_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        can_create_domains:
          type: boolean
        can_create_routes:
          type: boolean
        can_create_api_keys:
          type: boolean
    MailboxGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        principal_type:
          type: string
          enum:
          - user
          - api_key
        principal_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - manager
          - writer
          - reader
        created_at:
          type: string
          format: date-time
    ZoneGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        principal_type:
          type: string
          enum:
          - user
          - api_key
        principal_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - editor
          - viewer
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    SendIdentity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
          nullable: true
        address:
          type: string
        identity_type:
          type: string
          enum:
          - exact
          - domain_wildcard
        verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    SendAsGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        identity_id:
          type: string
          format: uuid
        principal_type:
          type: string
          enum:
          - user
          - api_key
        principal_id:
          type: string
          format: uuid
        daily_quota:
          type: integer
          description: 0 = unlimited
        created_at:
          type: string
          format: date-time
    CreateMailboxGrantRequest:
      type: object
      required:
      - principal_type
      - principal_id
      - role
      properties:
        principal_type:
          type: string
          enum:
          - user
          - api_key
        principal_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - manager
          - writer
          - reader
    CreateZoneGrantRequest:
      type: object
      required:
      - principal_type
      - principal_id
      - role
      properties:
        principal_type:
          type: string
          enum:
          - user
          - api_key
        principal_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - editor
          - viewer
    CreateSendIdentityRequest:
      type: object
      required:
      - zone_id
      - address
      properties:
        zone_id:
          type: string
          format: uuid
        address:
          type: string
          example: noreply@mail.example.com
    CreateSendAsGrantRequest:
      type: object
      required:
      - principal_type
      - principal_id
      properties:
        principal_type:
          type: string
          enum:
          - user
          - api_key
        principal_id:
          type: string
          format: uuid
        daily_quota:
          type: integer
          default: 0
          description: 0 = unlimited
    CompanySettings:
      type: object
      properties:
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        primary_zone_id:
          type: string
          format: uuid
        domain:
          type: string
        revision:
          type: integer
        mail_send_policy:
          type: string
          enum:
          - free
          - template_required
          - disabled
          description: Company-wide default outbound send policy. In requests an omitted or empty value leaves the current default unchanged.
    CompanyInvitationInput:
      type: object
      properties:
        email:
          type: string
        local_part:
          type: string
        display_name:
          type: string
        permission_profile_id:
          type: string
          format: uuid
          description: Optional; null when absent.
    CompanyInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        mailbox_address:
          type: string
        display_name:
          type: string
        expires_at:
          type: string
          format: date-time
        consumed_at:
          type: string
          format: date-time
          description: Optional; null when absent.
        revoked_at:
          type: string
          format: date-time
          description: Optional; null when absent.
        created_at:
          type: string
          format: date-time
    CompanyMailboxInput:
      type: object
      properties:
        local_part:
          type: string
        kind:
          type: string
        owner_user_id:
          type: string
          format: uuid
          description: Optional; null when absent.
        retention_hours:
          type: integer
          description: Optional; null when absent.
    CompanyMailboxAccess:
      type: object
      properties:
        mailbox:
          $ref: '#/components/schemas/Mailbox'
        can_read:
          type: boolean
        can_organize:
          type: boolean
        can_send:
          type: boolean
        template_only:
          type: boolean
        revision:
          type: integer
    CompanyVariable:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        max_length:
          type: integer
        options:
          type: array
          items:
            type: string
    CompanyTemplateDraft:
      type: object
      properties:
        subject:
          type: string
        text_body:
          type: string
        html_body:
          type: string
        variables:
          type: array
          items:
            $ref: '#/components/schemas/CompanyVariable'
    CompanyTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        draft:
          $ref: '#/components/schemas/CompanyTemplateDraft'
        revision:
          type: integer
        retired:
          type: boolean
        updated_at:
          type: string
          format: date-time
    CompanyTemplateVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: integer
        snapshot:
          $ref: '#/components/schemas/CompanyTemplateDraft'
        content_hash:
          type: string
        published_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: Optional; null when absent.
    CompanyTemplateGrant:
      type: object
      properties:
        template_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
    CompanyDraftPayload:
      type: object
      properties:
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          items:
            type: string
        subject:
          type: string
        text_body:
          type: string
        html_body:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        template_version_id:
          type: string
          format: uuid
          description: Optional; null when absent.
        template_vars:
          type: object
          additionalProperties:
            type: string
        attachment_ids:
          type: array
          items:
            type: string
            format: uuid
    CompanyDraft:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        payload:
          $ref: '#/components/schemas/CompanyDraftPayload'
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
    CompanyAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
        state:
          type: string
    CompanyMailEvent:
      type: object
      properties:
        sequence:
          type: integer
        type:
          type: string
        message_id:
          type: string
          format: uuid
          description: Optional; null when absent.
    CompanyRecipient:
      type: object
      properties:
        address:
          type: string
        state:
          type: string
        smtp_code:
          type: integer
        diagnostic:
          type: string
        attempts:
          type: integer
        updated_at:
          type: string
          format: date-time
    CompanyRecoveryTarget:
      type: object
      properties:
        mailbox_id:
          type: string
          format: uuid
        address:
          type: string
        state:
          type: string
        error:
          type: string
    CompanyRecoveryReceipt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        error:
          type: string
        updated_at:
          type: string
          format: date-time
        raw_size:
          type: integer
        targets:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRecoveryTarget'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: Daily quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: QUOTA_EXCEEDED
              message: daily send quota exceeded (50/50)
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 30
        minimum: 1
        maximum: 100
      description: Items per page
paths:
  /api/v1/domains:
    get:
      tags:
      - Domains
      summary: List domain zones
      operationId: listDomains
      security:
      - APIKey: []
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainZone'
  /api/v1/domains/{id}/grants:
    get:
      tags:
      - Grants
      summary: List grants for a domain zone
      operationId: listZoneGrants
      description: List all grants assigned to a domain zone.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Domain zone ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ZoneGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Grants
      summary: Create a grant for a domain zone
      operationId: createZoneGrant
      description: Assign a role-based grant to a user or API key for a domain zone.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Domain zone ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneGrantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ZoneGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/domains/{id}/grants/{grantId}:
    delete:
      tags:
      - Grants
      summary: Delete a domain zone grant
      operationId: deleteZoneGrant
      description: Remove a grant from a domain zone.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Domain zone ID
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Grant ID
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mailboxes/{mailboxId}/grants:
    get:
      tags:
      - Grants
      summary: List grants for a mailbox
      operationId: listMailboxGrants
      description: List all grants assigned to a mailbox.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Mailbox ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MailboxGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Grants
      summary: Create a grant for a mailbox
      operationId: createMailboxGrant
      description: Assign a role-based grant to a user or API key for a mailbox.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Mailbox ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMailboxGrantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MailboxGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mailboxes/{mailboxId}/grants/{id}:
    delete:
      tags:
      - Grants
      summary: Delete a mailbox grant
      operationId: deleteMailboxGrant
      description: Remove a grant from a mailbox.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Mailbox ID
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Grant ID
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/keys:
    post:
      tags:
      - Auth
      summary: Create an API key for the current user's tenant
      operationId: userCreateAPIKey
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  description: Explicit API key scopes. If omitted, a read-only default is used.
                  items:
                    $ref: '#/components/schemas/APIKeyScope'
      responses:
        '201':
          description: Created (key shown only once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Auth
      summary: List API keys for the current user's tenant
      operationId: userListAPIKeys
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyCreated'
  /api/v1/keys/{keyId}:
    delete:
      tags:
      - Auth
      summary: Delete an API key from the current user's tenant
      operationId: userDeleteAPIKey
      security:
      - BearerAuth: []
      parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/send-identities/{id}/grants:
    get:
      tags:
      - Grants
      summary: List send-as grants for a send identity
      operationId: listSendAsGrants
      description: List all send-as grants for a specific send identity.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Send identity ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SendAsGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Grants
      summary: Create a send-as grant
      operationId: createSendAsGrant
      description: Grant a user or API key permission to send as a specific identity.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Send identity ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSendAsGrantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SendAsGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/send-identities/{id}/grants/{grantId}:
    delete:
      tags:
      - Grants
      summary: Delete a send-as grant
      operationId: deleteSendAsGrant
      description: Remove a send-as grant from a send identity.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Send identity ID
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Grant ID
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/outbound:
    get:
      tags:
      - Sending
      summary: List outbound jobs
      operationId: listOutboundJobs
      description: List outbound email delivery jobs for the current tenant.
      security:
      - BearerAuth: []
      - APIKey: []
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated list of outbound jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboundJob'
                  total:
                    type: integer
  /api/v1/outbound/{id}:
    get:
      tags:
      - Sending
      summary: Get outbound job status
      operationId: getOutboundJob
      description: Get the delivery status of a specific outbound email job.
      security:
      - BearerAuth: []
      - APIKey: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Outbound job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/domains:
    get:
      tags:
      - Admin
      summary: List all domain resources
      operationId: adminListDomains
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainZone'
  /api/v1/admin/permissions:
    get:
      tags:
      - Permissions
      summary: List all permission profiles
      operationId: listPermissionProfiles
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PermissionProfile'
    post:
      tags:
      - Permissions
      summary: Create permission profile
      operationId: createPermissionProfile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                description:
                  type: string
                can_send:
                  type: boolean
                  default: false
                daily_send_quota:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                daily_receive_quota:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                max_mailboxes:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                max_domains:
                  type: integer
                  default: 0
                  description: 0 = unlimited
                allowed_zone_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  nullable: true
                  description: null = all zones allowed
                can_create_domains:
                  type: boolean
                  default: true
                can_create_routes:
                  type: boolean
                  default: true
                can_create_api_keys:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Profile name already exists
  /api/v1/admin/permissions/{id}:
    patch:
      tags:
      - Permissions
      summary: Update permission profile
      operationId: updatePermissionProfile
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                can_send:
                  type: boolean
                daily_send_quota:
                  type: integer
                daily_receive_quota:
                  type: integer
                max_mailboxes:
                  type: integer
                max_domains:
                  type: integer
                allowed_zone_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  nullable: true
                can_create_domains:
                  type: boolean
                can_create_routes:
                  type: boolean
                can_create_api_keys:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PermissionProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Permissions
      summary: Delete permission profile
      operationId: deletePermissionProfile
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Deleted
        '400':
          description: Cannot delete system profiles
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/users/{id}/permissions:
    get:
      tags:
      - Permissions
      summary: Get user's effective permissions
      operationId: getUserPermissions
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EffectivePermission'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Permissions
      summary: Set user permission override
      operationId: setUserPermissionOverride
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_id:
                  type: string
                  format: uuid
                  description: Permission profile to assign
                overrides:
                  type: object
                  description: Field-level overrides on top of the profile
                  properties:
                    can_send:
                      type: boolean
                    daily_send_quota:
                      type: integer
                    daily_receive_quota:
                      type: integer
                    max_mailboxes:
                      type: integer
                    max_domains:
                      type: integer
                    allowed_zone_ids:
                      type: array
                      items:
                        type: string
                        format: uuid
                      nullable: true
                    can_create_domains:
                      type: boolean
                    can_create_routes:
                      type: boolean
                    can_create_api_keys:
                      type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EffectivePermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Permissions
      summary: Delete user permission override
      operationId: deleteUserPermissionOverride
      description: Remove user-specific permission override, reverting to the default profile.
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Override removed
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/me/permissions:
    get:
      tags:
      - Permissions
      summary: Get my permissions
      operationId: getMyPermissions
      description: Get the effective permissions for the currently authenticated user.
      security:
      - BearerAuth: []
      - APIKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EffectivePermission'
        '401':
          description: Not authenticated
  /api/v1/admin/tenants:
    get:
      tags:
      - Admin
      summary: List all tenants
      operationId: listTenants
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tenant'
    post:
      tags:
      - Admin
      summary: Create a tenant
      operationId: createTenant
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - plan_id
              properties:
                name:
                  type: string
                plan_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Created
  /api/v1/admin/tenants/{id}:
    patch:

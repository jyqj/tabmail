        size:
          type: integer
          minimum: 0
      additionalProperties: false
    CompanyInvitationIssued:
      type: object
      required:
      - invitation
      - activation_token
      properties:
        invitation:
          $ref: '#/components/schemas/CompanyInvitation'
        activation_token:
          type: string
          pattern: ^[a-f0-9]{64}$
      additionalProperties: false
    CompanyRecoveryInspection:
      type: object
      required:
      - receipt
      - original_valid
      properties:
        receipt:
          $ref: '#/components/schemas/CompanyRecoveryReceipt'
        original_valid:
          type: boolean
      additionalProperties: false
    CompanyOutboundInspection:
      type: object
      description: Audited platform-operations exception projection, not an ordinary submission receipt.
      required:
      - job
      - recipients
      properties:
        job:
          $ref: '#/components/schemas/CompanyOutboundInspectionJob'
        recipients:
          type: array
          maxItems: 50
          description: Complete fenced recipient ledger, including structured BCC. Oversized or busy snapshots fail
            with 409 rather than returning a truncated ledger.
          items:
            $ref: '#/components/schemas/CompanyOutboundInspectionRecipient'
      additionalProperties: false
    CompanyOutboundInspectionJob:
      type: object
      description: Explicit content and structured BCC projection for the current super administrator's audited
        inspection exception only. This does not grant ordinary mailbox body access or widen ordinary receipts.
        Storage keys, raw MIME, leases, claim tokens, credentials and raw SMTP diagnostics are never exposed.
      required:
      - id
      - tenant_id
      - state
      - status
      - created_at
      - updated_at
      - mail_from
      - to
      - cc
      - bcc
      - subject
      - text_body
      - html_body
      - headers
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, processing, sent, retry, failed, dead, cancelled]
        status:
          type: string
          enum: [submitted, cancelled, sending, partially_accepted, accepted, needs_attention]
          description: Derived from the job and complete ledger; accepted means next-hop acceptance, not final
            delivery. Missing, malformed or uncertain ledger evidence yields needs_attention.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        mail_from:
          type: string
        to:
          type: array
          items:
            type: string
        cc:
          type: array
          items:
            type: string
        bcc:
          type: array
          description: Structured hidden recipients in this audited exception only; never a wire Bcc header.
          items:
            type: string
        subject:
          type: string
        text_body:
          type: string
        html_body:
          type: string
        headers:
          $ref: '#/components/schemas/CompanyOutboundInspectionHeaders'
      additionalProperties: false
    CompanyOutboundInspectionRecipient:
      type: object
      required:
      - address
      - kind
      - state
      - attempts
      - smtp_code
      - diagnostic_class
      - updated_at
      properties:
        address:
          type: string
        kind:
          type: string
          enum: [to, cc, bcc, envelope]
          description: Structured recipient category; envelope when no To, Cc or Bcc category matches.
        state:
          type: string
          enum: [pending, accepted, temporary, permanent, uncertain, unknown]
          description: accepted is next-hop acceptance, not final delivery. Unrecognized storage states are
            sanitized to unknown, never emitted as raw strings.
        attempts:
          type: integer
        smtp_code:
          type: integer
          anyOf:
          - enum: [0]
          - minimum: 200
            maximum: 599
          description: Numeric SMTP code from 200 through 599, or 0 when absent or invalid; no raw SMTP response.
        enhanced_code:
          type: string
          pattern: '^[245]\.[0-9]{1,3}\.[0-9]{1,3}(?![\s\S])'
          description: Optional sanitized enhanced status code only; omitted if no valid token exists in the
            diagnostic. Never includes surrounding raw diagnostic text.
        diagnostic_class:
          type: string
          enum: [pending, accepted, temporary, permanent, uncertain, unknown]
          description: Sanitized recipient state class, not the raw diagnostic message.
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    CompanyOutboundInspectionHeaders:
      type: object
      description: Canonical header names from this exact structural allowlist only. Values containing CR or LF
        are rejected by the projection. No general Content-* or X-* wildcard, Bcc, Received, authentication,
        DKIM signature or system-secret header is permitted. Empty or malformed storage headers project to {}.
      properties:
        From:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        To:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Cc:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Subject:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Date:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Message-Id:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Reply-To:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        In-Reply-To:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        References:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Mime-Version:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Content-Type:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Content-Transfer-Encoding:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Content-Disposition:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
        Content-Id:
          type: string
          pattern: '^[^\r\n]*(?![\s\S])'
      additionalProperties: false
    CompanyErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              minLength: 1
            message:
              type: string
            reason:
              type: string
          additionalProperties: false
        data:
          type: object
      additionalProperties: false
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: Daily quota exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: QUOTA_EXCEEDED
              message: daily send quota exceeded (50/50)
    CompanyFailure:
      description: Request denied, conflicted, limited, or failed. A failure is not a success receipt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyErrorEnvelope'
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    PerPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 30
        minimum: 1
        maximum: 100
      description: Items per page
paths:
  /api/v1/domains:
    get:
      tags:
      - Domains
      summary: List domain zones
      operationId: listDomains
      security:
      - APIKey: []
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DomainZone'
  /api/v1/domains/{id}/grants:

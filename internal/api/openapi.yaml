      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: At most 128 UTF-8 bytes; CR/LF forbidden. Reuse the same key only for an identical submission.
      description: Consumes the observed draft revision atomically. A repeated Idempotency-Key replays the original
        metadata-only receipt after current command-principal admission. Content-read revocation alone
        does not reject an otherwise authorized replay, but revoked command credentials do. Fresh committed
        submissions may return minimal unknown-progress fallback if display authority becomes unavailable;
        local acceptance is not final delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - expected_revision
              properties:
                expected_revision:
                  type: integer
                  minimum: 1

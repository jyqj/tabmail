  /api/v1/company/events:
    get:
      tags:
      - Company
      summary: Stream selected-company administrative invalidations
      operationId: streamCompanyAdminEvents
      description: Interactive JWT administrators only, scoped to the selected company;
        not platform broadcasts or personal message/sent events. Authorization, tenant,
        role and session are revalidated for each read and bounded frame write/flush;
        revocation terminates the stream. ready/resync request an authoritative reload.
        Recent outbox windows may repeat or miss retained/late events; UUID Last-Event-ID
        is advisory deduplication only, never a commit-ordered replay cursor. Read-only
        transport neither claims nor acknowledges outbox events. Connection and periodic
        resync require fresh authoritative snapshots.
      security:
      - BearerAuth: []
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: Advisory event UUID only; no guaranteed replay, ordering or delivery.
          Does not select tenant or authorize access.
        schema:
          type: string
      responses:
        '200':
          description: 'SSE frames: ready and resync data contain only tenant_id; company.admin.changed
            has UUID id and exact invalidation metadata. No MIME, body, BCC, credentials,
            object keys or arbitrary audit payload.'
          headers:
            Cache-Control:
              schema:
                type: string
                const: private, no-store, no-transform
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: ready
  
                data: {"tenant_id":"11111111-1111-4111-8111-111111111111"}
  
  
                event: resync
  
                data: {"tenant_id":"11111111-1111-4111-8111-111111111111"}
  
  
                '
        '400':
          description: Invalid selected-tenant header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: JWT authentication required or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Interactive administrator or selected-company access rejected;
            API keys cannot subscribe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Stream/read port unavailable or internal error before headers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-sse-events:
        ready:
          data:
            $ref: '#/components/schemas/CompanyAdminStreamScope'
        resync:
          data:
            $ref: '#/components/schemas/CompanyAdminStreamScope'
        company.admin.changed:
          id:
            type: string
            format: uuid
            not:
              const: 00000000-0000-0000-0000-000000000000
          data:
            $ref: '#/components/schemas/CompanyAdminInvalidation'

openapi: 3.1.0
info:
  title: TabMail API
  version: '3.0'
  description: Company browser email with personal/shared mailboxes, independent read/organize/send-as
    grants, employee activation, immutable administrator templates, durable recipient delivery, drafts
    and recoverable deletion. Company production mode disables public registration, standalone mailbox
    tokens and automatic unknown recipient provisioning. Legacy platform routes remain for controlled
    compatibility; an administrator role alone does not grant message content access. All queued/accepted
    responses describe local acceptance or next-hop acceptance, not inbox delivery or reading. See docs/company-mail/RELEASE-R3.md
    for deployment and rollback requirements.
servers:
- url: /
  description: Current host
tags:
- name: Auth
  description: Authentication and user session management
- name: Domains
  description: Domain zone management
- name: Domain Routes
  description: Routing rules for domain zones
- name: Mailboxes
  description: Mailbox lifecycle management
- name: Messages
  description: Message retrieval and management
- name: Sending
  description: Outbound email sending API
- name: Permissions
  description: Permission profile management (admin only)
- name: Admin
  description: Administrative operations
- name: Grants
  description: Mailbox grants, zone grants, send identities, and send-as grants
- name: System
  description: Health, metrics, and documentation
security:
- {}
- APIKey: []
components:
  securitySchemes:
    APIKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Tenant API key
    MailboxToken:
      type: http
      scheme: bearer
      bearerFormat: TabMail-Mailbox-Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /auth/login
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - BAD_REQUEST
              - UNAUTHORIZED
              - FORBIDDEN
              - NOT_FOUND
              - CONFLICT
              - RATE_LIMITED
              - QUOTA_EXCEEDED
              - DOMAIN_NOT_VERIFIED
              - SEND_NOT_ALLOWED
              - INTERNAL
            message:
              type: string
    Meta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    Plan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        max_domains:
          type: integer
        max_mailboxes_per_domain:
          type: integer
        max_messages_per_mailbox:
          type: integer
        max_message_bytes:
          type: integer
        retention_hours:
          type: integer
        rpm_limit:
          type: integer
        daily_quota:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Tenant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plan_id:
          type: string
          format: uuid
        is_super:
          type: boolean
        created_at:
          type: string
          format: date-time
    TenantOverride:
      type: object
      properties:
        max_domains:
          type: integer
          nullable: true
        max_mailboxes_per_domain:
          type: integer
          nullable: true
        max_messages_per_mailbox:
          type: integer
          nullable: true
        max_message_bytes:
          type: integer
          nullable: true
        retention_hours:
          type: integer
          nullable: true
        rpm_limit:
          type: integer
          nullable: true
        daily_quota:
          type: integer
          nullable: true
    TenantOverrideSnapshot:
      type: object
      additionalProperties: false
      description: Raw tenant overrides. Null means inherited; a tenant without an override row has all seven fields null.
      required:
      - tenant_id
      - max_domains
      - max_mailboxes_per_domain
      - max_messages_per_mailbox
      - max_message_bytes
      - retention_hours
      - rpm_limit
      - daily_quota
      properties:
        tenant_id:
          type: string
          format: uuid
        max_domains:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
        max_mailboxes_per_domain:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
        max_messages_per_mailbox:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
        max_message_bytes:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
        retention_hours:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
        rpm_limit:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
        daily_quota:
          type:
          - integer
          - 'null'
          minimum: -2147483648
          maximum: 2147483647
    EffectiveConfig:
      type: object
      properties:
        max_domains:
          type: integer
        max_mailboxes_per_domain:
          type: integer
        max_messages_per_mailbox:
          type: integer
        max_message_bytes:
          type: integer
        retention_hours:
          type: integer
        rpm_limit:
          type: integer
        daily_quota:
          type: integer
    DomainZone:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
          nullable: true
        parent_zone_id:
          type: string
          format: uuid
          nullable: true
        domain:
          type: string
        visibility:
          type: string
          enum:
          - private
          - authenticated
          - public
        allow_random_subdomains:
          type: boolean
        is_verified:
          type: boolean
        mx_verified:
          type: boolean
        txt_record:
          type: string
        created_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
          nullable: true
    DomainRoute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        route_type:
          type: string
          enum:
          - exact
          - wildcard
          - deep_wildcard
          - sequence
        match_value:
          type: string
        range_start:
          type: integer
          nullable: true
        range_end:
          type: integer
          nullable: true
        auto_create_mailbox:
          type: boolean
        retention_hours_override:
          type: integer
          nullable: true
        access_mode_default:
          type: string
          enum:
          - public
          - token
          - api_key
        created_at:
          type: string
          format: date-time
    Mailbox:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        owner_user_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Personal mailbox owner; explicit grants authorize shared access
        local_part:
          type: string
        resolved_domain:
          type: string
        full_address:
          type: string
        access_mode:
          type: string
          enum:
          - public
          - token
          - api_key
        retention_hours_override:
          type: integer
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        send_policy:
          type: string
          enum:
          - free
          - template_required
          - disabled
          description: Effective send policy, COALESCE(mailbox override, company default).
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        mailbox_id:
          type: string
          format: uuid
        sender:
          type: string
        recipients:
          type: array
          items:
            type: string
        subject:
          type: string
        size:
          type: integer
        seen:
          type: boolean
        starred:
          type: boolean
          description: Per-user flag merged from message_user_states; legacy mailbox paths report false
        headers:
          type: object
        received_at:
          type: string
          format: date-time
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: NULL means permanent retention; owner mailboxes do not inherit temporary-plan TTL
        otp_code:
          type: string
          description: Omitted when content access is redacted
        otp_confidence:
          type: number
    MessageDetail:
      allOf:
      - $ref: '#/components/schemas/Message'
      - type: object
        properties:
          text_body:
            type: string
          html_body:
            type: string
    Submission:
      $ref: '#/components/schemas/OutboundReceipt'
    APIKeyScope:
      type: string
      enum:
      - domains:read
      - domains:write
      - routes:read
      - routes:write
      - mailboxes:read
      - mailboxes:write
      - messages:read
      - messages:write
      - send:read
      - send:write
    APIKeyCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Full key (shown only once)
        key_prefix:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/APIKeyScope'
        created_at:
          type: string
          format: date-time
    MailboxTokenResponse:
      type: object
      properties:
        token:
          type: string
        expires_in:
          type: integer
    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    SMTPMetrics:
      type: object
      properties:
        sessions_opened:
          type: integer
        sessions_active:
          type: integer
        recipients_accepted:
          type: integer
        recipients_rejected:
          type: integer
        messages_accepted:
          type: integer
        messages_rejected:
          type: integer
        deliveries_succeeded:
          type: integer
        deliveries_failed:
          type: integer
        bytes_received:
          type: integer
    WebhookMetrics:
      type: object
      properties:
        enabled:
          type: boolean
        configured:
          type: integer
        queued:
          type: integer
        delivered:
          type: integer
        failed:
          type: integer
    RealtimeMetrics:
      type: object
      properties:
        subscribers_current:
          type: integer
        events_published:
          type: integer
    MetricPoint:
      type: object
      properties:
        at:
          type: string
          format: date-time
        smtp_accepted:
          type: integer
        smtp_rejected:
          type: integer
        deliveries_ok:
          type: integer
        deliveries_failed:
          type: integer
        webhooks_delivered:
          type: integer
        webhooks_failed:
          type: integer
        realtime_published:
          type: integer
    DeliveryStats:
      type: object
      description: >-
        Process-lifetime delivery counters. Up to the first 4096 tenant keys
        and 4096 mailbox keys are retained independently. Further keys share
        a separate aggregate without losing global totals. Top lists reserve
        their final row for that aggregate when present, within the row limit;
        ordinary rows rank the retained keys by delivery volume.
      properties:
        key:
          type: string
          description: Real tenant or mailbox key; empty only for an aggregate row.
        aggregate:
          type: boolean
          default: false
          description: True for the combined counters of all keys beyond the retained set; omitted for ordinary rows.
        accepted:
          type: integer
        rejected:
          type: integer
        deliveries_ok:
          type: integer
        deliveries_failed:
          type: integer
    DeadLetter:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        event_type:
          type: string
        payload:
          type: object
        attempts:
          type: integer
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        last_tried_at:
          type: string
          format: date-time
    SMTPPolicy:
      type: object
      properties:
        default_accept:
          type: boolean
        accept_domains:
          type: array
          items:
            type: string
        reject_domains:
          type: array
          items:
            type: string
        default_store:
          type: boolean
        store_domains:
          type: array
          items:
            type: string
        discard_domains:
          type: array
          items:
            type: string
        reject_origin_domains:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time
    MonitorEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        mailbox:
          type: string
        message_id:
          type: string
        sender:
          type: string
        subject:
          type: string
        size:
          type: integer
        at:
          type: string
          format: date-time
    MetricsSnapshot:
      type: object
      properties:
        started_at:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
        smtp:
          $ref: '#/components/schemas/SMTPMetrics'
        webhooks:
          $ref: '#/components/schemas/WebhookMetrics'
        realtime:
          $ref: '#/components/schemas/RealtimeMetrics'
        time_series:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
    SystemStats:
      type: object
      properties:
        tenants_count:
          type: integer
        plans_count:
          type: integer
        domains_count:
          type: integer
        mailboxes_count:
          type: integer
        messages_count:
          type: integer
        metrics:
          $ref: '#/components/schemas/MetricsSnapshot'
        recent_audit:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        tenant_delivery:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStats'
        mailbox_delivery:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryStats'
        dead_letters:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetter'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
          - user
        is_active:
          type: boolean
        permission_profile_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
    IngestJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        remote_ip:
          type: string
        mail_from:
          type: string
        recipients:
          type: array
          items:
            type: string
        state:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        next_attempt_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WebhookDelivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        url:
          type: string
        event_type:
          type: string
        payload:
          type: object
        state:
          type: string
        attempts:
          type: integer
        last_error:
          type: string
        next_attempt_at:
          type: string
          format: date-time
        last_tried_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SystemSetting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        description:
          type: string
        updated_at:
          type: string
          format: date-time
    AdminInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        invite_code:
          type: string
        expires_at:
          type: string
          format: date-time
    SendEmailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message_id:
          type: string
          example: <uuid@mail.example.com>
        state:
          $ref: '#/components/schemas/OutboundState'
        created_at:
          type: string
          format: date-time
    OutboundState:
      type: string
      enum:
      - pending
      - processing
      - sent
      - retry
      - failed
      - dead
    OutboundJob:
      $ref: '#/components/schemas/OutboundReceipt'
    OutboundReceipt:
      type: object
      additionalProperties: false
      required: [id, state, status, progress, delivery_uncertain]
      description: Strict metadata-only ordinary receipt, independent of content-read authority.
        Accepted means next-hop acceptance, not final delivery. No subject, sender or recipient
        addresses, content, protocol diagnostics, storage references or principal identifiers
        are returned. After an already committed submit or retry, unavailable presentation
        authority returns only the committed ID, normalized state, needs_attention, unknown
        progress, false delivery_uncertain and all-false capabilities with unknown reason;
        tenant, timestamps, attempt count and next retry are omitted, not invented or null.
      properties:
        id: {type: string, format: uuid}
        tenant_id:
          type: string
          format: uuid
          description: Present only from the current authorized receipt snapshot.
        state:
          type: string
          enum: [pending, processing, sent, retry, failed, dead, cancelled, unknown]
        status:
          type: string
          enum: [cancelled, submitted, sending, partially_accepted, accepted, needs_attention]
        progress:
          $ref: '#/components/schemas/OutboundReceiptProgress'
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        attempt_count: {type: integer, minimum: 0}
        next_retry:
          type: string
          format: date-time
          description: Omitted unless a retry-state snapshot has a known next attempt time.
        delivery_uncertain:
          type: boolean
          description: Known delivery ambiguity; false alone does not prove delivery or a known ledger.
        capabilities:
          $ref: '#/components/schemas/SubmissionCapabilities'
    OutboundReceiptProgress:
      type: object
      additionalProperties: false
      required: [completeness]
      properties:
        completeness: {type: string, enum: [known, unknown]}
        counts:
          $ref: '#/components/schemas/OutboundReceiptCounts'
      oneOf:
      - properties:
          completeness: {enum: [known]}
        required: [counts]
      - properties:
          completeness: {enum: [unknown]}
        not:
          required: [counts]
      description: Counts cover the complete durable ledger, including all recipient categories,
        never a filtered visible-recipient subset. Missing, empty or malformed ledger evidence
        is unknown with counts omitted, not an invented zero-recipient success.
    OutboundReceiptCounts:
      type: object
      additionalProperties: false
      required: [total, accepted, pending, temporary, permanent, uncertain]
      properties:
        total: {type: integer, minimum: 1}
        accepted: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        temporary: {type: integer, minimum: 0}
        permanent: {type: integer, minimum: 0}
        uncertain: {type: integer, minimum: 0}
    OutboundReceiptResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/OutboundReceipt'
    OutboundReceiptListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OutboundReceipt'
        meta:
          type: object
          additionalProperties: false
          required: [total, page, per_page]
          properties:
            total: {type: integer, minimum: 0}
            page: {type: integer, minimum: 1}
            per_page: {type: integer, minimum: 1}
    PermissionProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        can_send:
          type: boolean
        daily_send_quota:
          type: integer
          description: 0 = unlimited
        daily_receive_quota:
          type: integer
          description: 0 = unlimited
        max_mailboxes:
          type: integer
          description: 0 = unlimited
        max_domains:
          type: integer
          description: 0 = unlimited
        allowed_zone_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: null = all zones allowed
        can_create_domains:
          type: boolean
        can_create_routes:
          type: boolean
        can_create_api_keys:
          type: boolean
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PermissionEditorAssignmentCommand:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      - profile_id
      - profile_revision
      - patch
      properties:
        expected_revision:
          $ref: '#/components/schemas/PermissionEditorRevision'
        profile_id:
          anyOf:
          - type: string
            format: uuid
            not:
              const: 00000000-0000-0000-0000-000000000000
          - type: 'null'
        profile_revision:
          anyOf:
          - type: string
            pattern: ^([1-9][0-9]{0,17}|[1-8][0-9]{18}|9[0-1][0-9]{17}|92[0-1][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[0-1][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-6][0-9]{0}|9223372036854775807)$
            description: Canonical positive signed-int64 decimal string; never a JSON
              number.
          - type: 'null'
        patch:
          $ref: '#/components/schemas/PermissionEditorPatch'
      oneOf:
      - properties:
          profile_id:
            type: 'null'
          profile_revision:
            type: 'null'
      - properties:
          profile_id:
            type: string
            format: uuid
            not:
              const: 00000000-0000-0000-0000-000000000000
          profile_revision:
            type: string

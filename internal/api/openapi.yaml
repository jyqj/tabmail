        schema:
          type: string
          format: uuid
        description: Domain zone ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ZoneGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Grants
      summary: Create a grant for a domain zone
      operationId: createZoneGrant
      description: Assign a role-based grant to a user or API key for a domain zone.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Domain zone ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateZoneGrantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ZoneGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/domains/{id}/grants/{grantId}:
    delete:
      tags:
      - Grants
      summary: Delete a domain zone grant
      operationId: deleteZoneGrant
      description: Remove a grant from a domain zone.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Domain zone ID
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Grant ID
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mailboxes/{mailboxId}/grants:
    get:
      tags:
      - Grants
      summary: List grants for a mailbox
      operationId: listMailboxGrants
      description: List all grants assigned to a mailbox.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Mailbox ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MailboxGrant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Grants
      summary: Create a grant for a mailbox
      operationId: createMailboxGrant
      description: Assign a role-based grant to a user or API key for a mailbox.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Mailbox ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMailboxGrantRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MailboxGrant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mailboxes/{mailboxId}/grants/{id}:
    delete:
      tags:
      - Grants
      summary: Delete a mailbox grant
      operationId: deleteMailboxGrant
      description: Remove a grant from a mailbox.
      security:
      - APIKey: []
      - BearerAuth: []
      parameters:
      - name: mailboxId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Mailbox ID
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Grant ID
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/keys:
    post:
      tags:
      - Auth
      summary: Create an API key for the current user's tenant
      operationId: userCreateAPIKey
      security:
      - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                scopes:
                  type: array
                  description: Explicit API key scopes. If omitted, a read-only default is used.
                  items:
                    $ref: '#/components/schemas/APIKeyScope'
      responses:
        '201':
          description: Created (key shown only once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/APIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      tags:
      - Auth
      summary: List API keys for the current user's tenant
      operationId: userListAPIKeys
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyCreated'
  /api/v1/keys/{keyId}:
    delete:
      tags:
      - Auth
      summary: Delete an API key from the current user's tenant
      operationId: userDeleteAPIKey
      security:
      - BearerAuth: []
      parameters:
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: tabmail
    metrics_path: /metrics
    # /metrics is authenticated; set the same value as TABMAIL_HTTP_METRICS_TOKEN.
    authorization:
      type: Bearer
      credentials: replace-with-metrics-scrape-token
    static_configs:
      # Split production roles expose HTTP only on the API. Worker health and
      # queue outcomes below are database-derived, not process-local counters.
      # For the monolithic development compose use tabmail:8080 instead.
      - targets: [tabmail-api:8080]

name: R2 source review
on:
  push:
    branches: [fix/company-mail-release-blockers-r2]
    paths: [.github/workflows/r2-source-review.yml]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch completed validation logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/jyqj/tabmail/actions/runs/34950562548/logs' -o /tmp/r2-validation-logs.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/r2-validation-logs.zip') as z:
              names=[n for n in z.namelist() if 'Company Compose' in n]
              print('Matching log files:',names)
              for n in names:
                  data=z.read(n).decode('utf8',errors='replace')
                  excerpt='\n'.join(data.splitlines()[-85:])
                  print(excerpt[-18000:])
                  Path('/tmp/r2-build-error.txt').write_text(excerpt)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r2-production-diagnostics
          path: |
            /tmp/r2-build-error.txt
            /tmp/r2-validation-logs.zip
          retention-days: 3

name: PR14 regression source correction
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['.github/workflows/pr14-regression-fix.yml']
permissions:
  contents: read
jobs:
  correct:
    if: github.repository == 'jyqj/tabmail' && github.event.pull_request.number == 14 && github.event.pull_request.head.repo.full_name == 'jyqj/tabmail' && github.event.pull_request.head.ref == 'fix/company-mail-safety-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply verified corrections without weakening assertions
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3660f512169374c4fa8e9c2bf4d5d4b500abcc5b
          test "$(git ls-remote origin refs/heads/fix/company-mail-safety-contracts | cut -f1)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          patches = [
            ('web/app/(dashboard)/mail/page.tsx',
             '      void mutateCache(["session", scope, [key, id]], undefined, { revalidate: false });',
             '      // Invalidate request deduplication too; clearing data alone can leave a\n      // just-regranted disclosure stuck on a discarded pre-revocation promise.\n      void mutateCache(["session", scope, [key, id]], undefined, { revalidate: true });'),
            ('internal/store/postgres/company_http_test.go',
             '\tr3HTTP(t, h, admin, "PUT", "/api/v1/company/mailboxes/"+shared+"/grants", models.MailboxGrant{UserID: f.employee.ID, CanSend: true, TemplateOnly: true}, 200)',
             '\tgrantPath := "/api/v1/company/mailboxes/" + shared + "/grants"\n\tgrantSnapshot := r3Data[company.MailboxGrantSnapshot](t, r3HTTP(t, h, admin, "GET", grantPath, nil, 200))\n\tr3HTTP(t, h, admin, "PUT", grantPath, map[string]any{"user_id": f.employee.ID, "can_send": true, "template_only": true, "revision": grantSnapshot.Revision}, 200)'),
            ('internal/store/postgres/company_integration_test.go',
             'want := 8 // 00008_send_policy',
             'want := 9 // 00009_domain_asset_guard'),
            ('internal/store/postgres/company_safety_contracts_test.go',
             'next.Draft.Subject = "New {{customer}}"',
             'next.Draft.Subject = "New {{.customer}}"'),
          ]
          for name, old, new in patches:
              p = Path(name)
              s = p.read_text()
              assert s.count(old) == 1, name
              p.write_text(s.replace(old, new))
              print(name)
          PY
          git add internal/store/postgres/company_http_test.go internal/store/postgres/company_integration_test.go internal/store/postgres/company_safety_contracts_test.go 'web/app/(dashboard)/mail/page.tsx'
          git rm .github/workflows/pr14-regression-fix.yml
          test "$(git write-tree)" = 06121a9d0823bbe3383a84c9a1d67f4a9efd0c60
          git diff --cached --check
          git restore --source=HEAD --staged --worktree .github/workflows/pr14-regression-fix.yml
          git config user.name 'TabMail maintenance'
          git config user.email 'tabmail-maintenance@users.noreply.github.com'
          git commit -m 'fix: invalidate revoked request cache and align real workflow regression fixtures'
          git push origin HEAD:refs/heads/fix/company-mail-safety-contracts

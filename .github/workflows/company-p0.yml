name: Company mail security and release checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: company-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabmail_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: tabmail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabmail_test -d tabmail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOSUMDB: sum.golang.org
      TABMAIL_TEST_DB_DSN: postgres://tabmail_test:disposable-test-password@localhost:5432/tabmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL client for coordinated restore rehearsal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Build
        run: go build ./...
      - name: Race tests with PostgreSQL
        run: |
          set -euo pipefail
          git rev-parse HEAD > go-test-source-sha.txt
          set +e
          go test -json -race -count=1 -timeout=180s ./... | tee go-test.jsonl
          test_exit=$?
          set -e
          python3 -B scripts/check_go_test_evidence.py --suite backend \
            --log go-test.jsonl --exit-code "$test_exit" \
            --source-sha "$(cat go-test-source-sha.txt)" | tee go-test-evidence.json
      - name: Prove missing execution cannot pass
        run: |
          python3 -B scripts/test_go_evidence_integration.py \
            --output-dir go-test-negative-evidence --source-sha "$(git rev-parse HEAD)"
      - name: Install pinned contract checker dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-contract.txt
      - name: Validation tool regressions
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: DTO field contract
        run: python3 scripts/check_contract_drift.py
      - name: Actual HTTP response contracts with PostgreSQL
        run: |
          python3 -B scripts/check_http_contract.py \
            --output-dir http-contract-evidence --source-sha "$(git rev-parse HEAD)"
      - name: Vet
        run: go vet ./...
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-p0-test-evidence
          path: |
            go-test.jsonl
            go-test-source-sha.txt
            go-test-evidence.json
            go-test-negative-evidence
            http-contract-evidence
            !http-contract-evidence/responses.json
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Catalog and TypeScript source validation
        run: |
          node --test scripts/tests/*.test.cjs
          node scripts/collect_api_calls.cjs --check
          python3 -B scripts/check_i18n_keys.py
      - name: Record full dependency audit
        working-directory: web
        run: npm audit --json > /tmp/tabmail-npm-audit.json || test -s /tmp/tabmail-npm-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: /tmp/tabmail-npm-audit.json
          retention-days: 14
      - name: Require a complete clean dependency audit
        run: |
          node -e 'const d=require("/tmp/tabmail-npm-audit.json"); if(!d.metadata?.vulnerabilities || d.error || d.metadata.vulnerabilities.total !== 0) throw new Error("dependency audit missing, failed or contains vulnerabilities");'
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  production-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate company Compose contract
        run: |
          set -euo pipefail
          cp .env.example /tmp/tabmail-release.env
          echo 'TABMAIL_OUTBOUND_RELAY_HOST=relay.example.invalid' >> /tmp/tabmail-release.env
          docker compose --env-file /tmp/tabmail-release.env -f docker-compose.prod.yml config --format json | python3 scripts/check_release_deploy.py
      - name: Build production standalone image and inspect baked API origin
        run: |
          set -euo pipefail
          docker compose --env-file /tmp/tabmail-release.env -f docker-compose.prod.yml build web
          docker run --rm --entrypoint node tabmail-prod-web -e 'const fs=require("fs"); const s=fs.readFileSync(".next/routes-manifest.json","utf8"); if(!s.includes("http://tabmail-api:8080") || s.includes("http://tabmail:8080")) throw new Error("wrong baked-in API origin"); console.log("PASS: production standalone rewrite targets tabmail-api:8080");'

  browser-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabmail_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: tabmail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabmail_test -d tabmail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TABMAIL_TEST_DB_DSN: postgres://tabmail_test:disposable-test-password@localhost:5432/tabmail_test?sslmode=disable
      INTERNAL_API_URL: http://127.0.0.1:18080
      TABMAIL_BROWSER_E2E: '1'
      TABMAIL_E2E_BROWSER_MODULE: /tmp/tabmail-browser/node_modules/@playwright/test
      TABMAIL_BROWSER_EVIDENCE: /tmp/tabmail-browser-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned isolated browser driver
        run: |
          npm install --prefix /tmp/tabmail-browser --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          /tmp/tabmail-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Build the shipping standalone frontend
        run: docker build --build-arg INTERNAL_API_URL=http://127.0.0.1:18080 -t tabmail-browser-standalone ./web
      - name: Exercise the production UI against the real API and loopback SMTP
        run: |
          set -euo pipefail
          docker run -d --name tabmail-browser --network host -e HOSTNAME=127.0.0.1 -e PORT=3000 tabmail-browser-standalone
          trap 'docker logs tabmail-browser >/tmp/tabmail-next.log 2>&1; docker rm -f tabmail-browser >/dev/null' EXIT
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3000 >/dev/null
          git rev-parse HEAD > /tmp/tabmail-browser-source-sha.txt
          set +e
          go test -json -count=1 -timeout=180s -run '^TestR3BrowserJourney$' ./internal/store/postgres | tee /tmp/tabmail-browser.jsonl
          test_exit=$?
          set -e
          python3 -B scripts/check_go_test_evidence.py --suite browser \
            --log /tmp/tabmail-browser.jsonl --exit-code "$test_exit" \
            --source-sha "$(cat /tmp/tabmail-browser-source-sha.txt)" | tee /tmp/tabmail-browser-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-browser-evidence
          path: |
            /tmp/tabmail-next.log
            /tmp/tabmail-browser.jsonl
            /tmp/tabmail-browser-source-sha.txt
            /tmp/tabmail-browser-evidence.json
            /tmp/tabmail-browser-evidence
          retention-days: 14

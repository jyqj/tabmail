name: P0 one-shot publication gate
on:
  push:
    branches: [feat/company-mail-p0]
    paths: ['scripts/company-p0-transfer/**', '.github/workflows/company-p0-delivery.yml']
permissions:
  contents: read
concurrency:
  group: p0-publication
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'jyqj/tabmail' && github.ref == 'refs/heads/feat/company-mail-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabmail_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: tabmail_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U tabmail_test -d tabmail_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOSUMDB: sum.golang.org
      TABMAIL_TEST_DB_DSN: postgres://tabmail_test:disposable-test-password@localhost:5432/tabmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify transport checksum and apply only business paths
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zlib
          root=pathlib.Path('scripts/company-p0-transfer')
          parts=[(root/f'part-{i}').read_text().strip() for i in range(4)]
          fix=json.loads((root/'repair.json').read_text())
          text=parts[fix['part']]
          assert hashlib.sha256(text.encode()).hexdigest()==fix['original_sha256']
          for a,b,old,new in reversed(fix['edits']):
              assert text[a:b]==old
              text=text[:a]+new+text[b:]
          assert hashlib.sha256(text.encode()).hexdigest()==fix['repaired_sha256']
          parts[fix['part']]=text
          patch=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='072714246bb9ceb8eb7a2e94e26cf6da2b368daf5c9fecaa7297473373462020','transport mismatch'
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  a,b=line.split()[2:]
                  assert a[2:]==b[2:]
                  p=pathlib.PurePosixPath(a[2:])
                  assert not p.is_absolute() and '..' not in p.parts
                  assert str(p).startswith(('internal/','docs/company-mail/')) or str(p) in ('README.md','web/lib/types.ts')
              if line.startswith(('new file mode ','old mode ','new mode ')):
                  assert line.split()[-1]=='100644','unexpected mode'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          pathlib.Path('/tmp/p0-business.patch').write_bytes(patch)
          PY
      - name: Reproduce original seven regressions on the original business tree
        run: |
          mkdir -p "$RUNNER_TEMP/red-tests"
          for path in internal/api/handlers/company_p0_test.go internal/app/messages/company_p0_test.go internal/ingest/company_p0_test.go internal/outbound/company_p0_test.go internal/store/postgres/company_p0_test.go; do
            mkdir -p "$RUNNER_TEMP/red-tests/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/red-tests/$path"
          done
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          cp -a "$RUNNER_TEMP/red-tests/." .
          set +e
          go test -json -count=1 -run '^TestP0' ./internal/api/handlers ./internal/app/messages ./internal/ingest ./internal/outbound ./internal/store/postgres > "$RUNNER_TEMP/red-tests.jsonl"
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json,os,pathlib
          rows=[json.loads(x) for x in (pathlib.Path(os.environ['RUNNER_TEMP'])/'red-tests.jsonl').read_text().splitlines() if x.startswith('{')]
          failed={x['Test'] for x in rows if x.get('Action')=='fail' and x.get('Test')}
          expected={'TestP0EmployeeCannotUseUnassignedMailboxFrom','TestP0TenantAdminCannotResolveAnotherTenantMailbox','TestP0BreakGlassRequiresPersistedAudit','TestP0DurableFailureRetainsOriginal','TestP0ZeroRetentionMeansNullExpiry','TestP0DataAcceptedQuitDisconnectedIsSuccess','TestP0BaselineDoesNotDropHistoricalGrants'}
          assert failed==expected,(failed,expected)
          print('Seven behavioral regressions reproduced:',sorted(failed))
          PY
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          git apply /tmp/p0-business.patch
      - name: Build and vet proposed business tree
        run: go build ./... && go vet ./...
      - name: Race tests with real PostgreSQL
        run: |
          set -o pipefail
          go test -json -race -count=1 -timeout=180s ./... | tee "$RUNNER_TEMP/green-tests.jsonl"
      - name: Verify DTO field contract
        run: python3 scripts/check_contract_drift.py
      - name: Upload red and green evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-publication-evidence
          path: |
            ${{ runner.temp }}/red-tests.jsonl
            ${{ runner.temp }}/green-tests.jsonl
          retention-days: 14
  publish:
    needs: verify
    if: github.repository == 'jyqj/tabmail' && github.ref == 'refs/heads/feat/company-mail-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/company-mail-p0
          fetch-depth: 1
      - name: Publish exactly the checked patch to the working branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zlib
          root=pathlib.Path('scripts/company-p0-transfer')
          parts=[(root/f'part-{i}').read_text().strip() for i in range(4)]
          fix=json.loads((root/'repair.json').read_text())
          text=parts[fix['part']]
          assert hashlib.sha256(text.encode()).hexdigest()==fix['original_sha256']
          for a,b,old,new in reversed(fix['edits']):
              assert text[a:b]==old
              text=text[:a]+new+text[b:]
          assert hashlib.sha256(text.encode()).hexdigest()==fix['repaired_sha256']
          parts[fix['part']]=text
          patch=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='072714246bb9ceb8eb7a2e94e26cf6da2b368daf5c9fecaa7297473373462020'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          git add -- internal docs/company-mail README.md web/lib/types.ts
          git rm -r -- scripts/company-p0-transfer
          git config user.name 'TabMail P0 validation'
          git config user.email 'p0-validation@users.noreply.github.com'
          git commit -m 'feat: company mailbox P0 authorization and durable recovery' -m 'Verified patch SHA256 072714246bb9ceb8eb7a2e94e26cf6da2b368daf5c9fecaa7297473373462020. Seven red regressions, build, vet and PostgreSQL race gate passed before publishing. No main merge or deployment.'
          git push origin HEAD:refs/heads/feat/company-mail-p0
          git rev-parse HEAD

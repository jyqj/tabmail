name: P0 transport integrity
on:
  push:
    branches: [feat/company-mail-p0]
    paths: ['scripts/company-p0-transfer/**', '.github/workflows/company-p0-transport.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: p0-transfer-integrity
          path: scripts/company-p0-transfer/
          retention-days: 1

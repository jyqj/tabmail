name: R3 isolated workspace export
on:
  push:
    branches: [fix/company-mail-complete-r3]
    paths: [.github/workflows/company-r3-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export tracked source only
        run: git archive --format=tar.gz HEAD > /tmp/tabmail-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: r3-source
          path: /tmp/tabmail-source.tar.gz
          retention-days: 2
      - name: Fetch locked development dependencies
        run: |
          go mod download
          npm ci --prefix web
      - name: Export dependency caches only (no credentials or runner environment)
        run: |
          tar -czf /tmp/tabmail-go-modules.tar.gz -C "$(go env GOPATH)/pkg" mod
          tar -czf /tmp/tabmail-node-modules.tar.gz -C web node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: r3-go-modules
          path: /tmp/tabmail-go-modules.tar.gz
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: r3-node-modules
          path: /tmp/tabmail-node-modules.tar.gz
          retention-days: 2

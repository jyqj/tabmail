name: Release blockers validation
on:
  push:
    branches: [feat/company-mail-release-blockers]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-blockers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: Prepare reproducible offline source and dependencies
        env:
          GOSUMDB: sum.golang.org
        run: |
          set -eu
          mkdir -p /tmp/tabmail-review/source /tmp/tabmail-review/toolchain
          git archive HEAD | tar -x -C /tmp/tabmail-review/source
          go mod vendor
          cp -a vendor /tmp/tabmail-review/source/
          cp -a "$(go env GOROOT)" /tmp/tabmail-review/toolchain/go
          git rev-parse HEAD > /tmp/tabmail-review/COMMIT
          tar -C /tmp/tabmail-review -czf /tmp/tabmail-review.tar.gz source toolchain COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: release-blockers-offline-source
          path: /tmp/tabmail-review.tar.gz
          retention-days: 3

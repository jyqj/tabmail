name: Company mail isolated workbench
on:
  push:
    branches: [work/company-mail-completion-r3]
    paths: [.github/workflows/workbench-r3.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Export a disposable database runtime, not application data
        run: |
          docker run --rm --entrypoint bash postgres:16-bookworm -ec '
            libs=$(ldd /usr/lib/postgresql/16/bin/postgres /usr/lib/postgresql/16/bin/initdb /usr/lib/postgresql/16/bin/psql | awk "/=> \\// {print \$3}" | sort -u | grep -Ev "/(libc\\.so|libm\\.so|libpthread\\.so|libdl\\.so|librt\\.so|libresolv\\.so)")
            tar -chzPf - /usr/lib/postgresql/16 /usr/share/postgresql/16 $libs
          ' > /tmp/postgres-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: company-mail-postgres-r3
          path: /tmp/postgres-runtime.tar.gz
          retention-days: 1

name: NEXT-1543 exact round PostgreSQL qualification on ARM
on:
  pull_request:
    branches: [fix/r5-next1543-wave3]
permissions:
  contents: read
concurrency:
  group: next1543-pg-arm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-rounds:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabmail_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: tabmail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabmail_test -d tabmail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOSUMDB: sum.golang.org
      GODEBUG: asynctimerchan=0
      TABMAIL_TEST_DB_DSN: postgres://tabmail_test:disposable-test-password@localhost:5432/tabmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17be458fb9d36e135a95962638b68ce105c16518
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Record the actual runtime
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED GOSUMDB
          docker exec "${{ job.services.postgres.id }}" psql -U tabmail_test -d tabmail_test -Atc 'SELECT version()'
      - name: Execute each frozen public round on its own clean source
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'next1543-pg-arm'
          output.mkdir(exist_ok=False)
          def git(*args):
              return subprocess.check_output(['git', '-C', str(root), *args], text=True).strip()
          attestor_commit = '17be458fb9d36e135a95962638b68ce105c16518'
          assert git('rev-parse', 'HEAD') == attestor_commit
          assert git('rev-parse', 'HEAD^{tree}') == 'fd362eed901840f23f58b477104a642f2a6cbf51'
          assert not git('status', '--porcelain', '--untracked-files=all')
          attestor = root / 'scripts/run_r5_next1543_pg.py'
          attestor_sha256 = hashlib.sha256(attestor.read_bytes()).hexdigest()
          rounds = [
              ('wave1', 'mailbox-grants', '559d01edd58c6af5cbc5965e1202ff575e4e2cda', '3b1b2644c7e7f05b57396afbf04daf8b8394da33'),
              ('wave2', 'derived-text', '7bb9b8abff9a6a53b1d0010f96cc13728a9330c5', '48f894a0417091278a9d197096d13995b9041b38'),
              ('wave3', 'reconcile-ledger', '17be458fb9d36e135a95962638b68ce105c16518', 'fd362eed901840f23f58b477104a642f2a6cbf51'),
          ]
          results = []
          for label, case, commit, tree in rounds:
              candidate = output / (label + '-source')
              subprocess.run(['git', '-C', str(root), 'worktree', 'add', '--detach', str(candidate), commit], check=True)
              try:
                  actual_tree = subprocess.check_output(['git', '-C', str(candidate), 'rev-parse', 'HEAD^{tree}'], text=True).strip()
                  assert actual_tree == tree
                  command = ['python3', '-B', str(attestor), '--candidate', str(candidate), '--case', case, '--output', str(output / label)]
                  run = subprocess.run(command)
                  results.append({'wave': label, 'case': case, 'source_commit': commit, 'source_tree': tree,
                                  'attestor_commit': attestor_commit, 'attestor_sha256': attestor_sha256,
                                  'command': command, 'exit_code': run.returncode})
              finally:
                  subprocess.run(['git', '-C', str(root), 'worktree', 'remove', '--force', str(candidate)], check=True)
          assert hashlib.sha256(attestor.read_bytes()).hexdigest() == attestor_sha256
          assert not git('status', '--porcelain', '--untracked-files=all')
          (output / 'rounds-summary.json').write_text(json.dumps(results, indent=2) + '\n')
          print(json.dumps({'rounds': results}, sort_keys=True), flush=True)
          raise SystemExit(1 if any(row['exit_code'] for row in results) else 0)
          PY
      - name: Retain every fixed baseline and candidate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next1543-exact-rounds-postgres-arm
          path: ${{ runner.temp }}/next1543-pg-arm
          if-no-files-found: error
          retention-days: 14

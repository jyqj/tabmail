name: PR14 exact source application
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths: ['scripts/maintenance/pr14-ops*.json', '.github/workflows/pr14-apply.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'jyqj/tabmail' && github.event.pull_request.number == 14 && github.event.pull_request.head.repo.full_name == 'jyqj/tabmail' && github.event.pull_request.head.ref == 'fix/company-mail-safety-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact authored changes to the isolated PR branch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d7018958b48286571ada023287bb131fc9653638
          test "$(git ls-remote origin refs/heads/fix/company-mail-safety-contracts | cut -f1)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          files = sorted(pathlib.Path('scripts/maintenance').glob('pr14-ops*.json'))
          assert len(files) == 7
          seen = set()
          for manifest in files:
              for name, expected, operations in json.loads(manifest.read_text()):
                  p = pathlib.Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  assert name.startswith(('internal/', 'web/', 'scripts/check_', 'docs/company-mail/'))
                  assert name not in seen
                  seen.add(name)
                  raw = p.read_bytes() if p.exists() else b''
                  assert hashlib.sha256(raw).hexdigest() == expected, name
                  lines = raw.decode().splitlines(keepends=True)
                  last = 0
                  for start, end, value in operations:
                      assert last <= start <= end <= len(lines), name
                      last = end
                  for start, end, value in reversed(operations):
                      lines[start:end] = [value]
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(''.join(lines).encode())
                  print(name)
          assert len(seen) == 41
          PY
          git add internal web scripts/check_contract_drift.py docs/company-mail/SAFETY-CONTRACTS.md
          git rm .github/workflows/pr14-apply.yml scripts/maintenance/pr14-ops*.json
          tree=$(git write-tree)
          git archive --format=tar --output=/tmp/pr14-result.tar "$tree"
          echo "$tree" > /tmp/pr14-tree.txt
          test "$tree" = 84739d087285e81c1fefeb61d5e44d2283298df9
          git diff --cached --check
          python3 scripts/check_contract_drift.py
          # Keep bootstrap files unchanged for this contents-only push. The
          # connected GitHub tool removes them in the final verified commit.
          git restore --source=HEAD --staged --worktree .github/workflows/pr14-apply.yml scripts/maintenance
          git config user.name 'TabMail maintenance'
          git config user.email 'tabmail-maintenance@users.noreply.github.com'
          git commit -m 'fix: protect domain assets and align company mail operation contracts'
          git push origin HEAD:refs/heads/fix/company-mail-safety-contracts
          git rev-parse HEAD >> /tmp/pr14-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr14-applied-source
          path: |
            /tmp/pr14-result.tar
            /tmp/pr14-tree.txt
          retention-days: 7

name: Temporary offline verification kit
on:
  push:
    branches: [fix/company-mail-completion-r3]
    paths: [.github/workflows/company-r3-toolchain.yml]
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Export public compiler and PostgreSQL binaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/kit/lib /tmp/kit/archive
          cp -a "$(go env GOROOT)" /tmp/kit/go
          cp -a /usr/lib/postgresql/16 /tmp/kit/postgresql
          cp -a /usr/share/postgresql/16 /tmp/kit/postgresql/share
          for f in /usr/lib/postgresql/16/bin/* /usr/lib/postgresql/16/lib/*.so; do ldd "$f" 2>/dev/null || true; done | awk '/=> \/.* \(/ { print $3 }' | sort -u | while read f; do case "$f" in */libc.so*|*/libm.so*|*/libpthread.so*|*/libdl.so*|*/librt.so*|*/ld-linux*) ;; *) cp -L "$f" /tmp/kit/lib/ ;; esac; done
          git fetch --no-tags origin b323cb26ef54d778f9e5d4f2e7a03924aa6fcbb1
          git archive FETCH_HEAD | tar -x -C /tmp/kit/archive
          tar -czf /tmp/tabmail-toolchain.tar.gz -C /tmp kit
      - uses: actions/upload-artifact@v4
        with:
          name: company-r3-toolchain
          path: /tmp/tabmail-toolchain.tar.gz
          retention-days: 1

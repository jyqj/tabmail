name: PR15 exact architecture source application
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'jyqj/tabmail' && github.event.pull_request.number == 15 && github.event.pull_request.head.repo.full_name == 'jyqj/tabmail' && github.event.pull_request.head.ref == 'refactor/company-mail-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply authored source with exact base and output verification
        shell: bash
        run: |
          set -euo pipefail
          branch=refactor/company-mail-architecture
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          python3 - <<'PY'
          import io, tarfile, subprocess, hashlib
          raw=subprocess.check_output(['git','archive','--format=tar','5a99281940e54a44ad6a02612c0fd33aaac01d1d'])
          with tarfile.open(fileobj=io.BytesIO(raw)) as src, tarfile.open('/tmp/base.tar','w',format=tarfile.GNU_FORMAT) as dst:
              for old in sorted(src.getmembers(),key=lambda v:v.name):
                  if not old.isfile() and not old.issym(): continue
                  m=tarfile.TarInfo(old.name); m.mode=old.mode; m.uid=m.gid=m.mtime=0
                  if old.issym(): m.type=tarfile.SYMTYPE; m.linkname=old.linkname
                  else: m.size=old.size
                  dst.addfile(m,src.extractfile(old) if old.isfile() else None)
          assert hashlib.sha256(open('/tmp/base.tar','rb').read()).hexdigest() == 'dea4243b787e3ffc9f61fbf31bfa61b002e87dcad883d5984e3f6c6969a293ef'
          PY
          cat .review/pr15-part-{0,1,2,3,4}.zst > /tmp/delta.zst
          zstd -d --patch-from=/tmp/base.tar /tmp/delta.zst -o /tmp/target.tar
          python3 - <<'PY'
          import tarfile,pathlib,hashlib,subprocess
          raw=pathlib.Path('/tmp/target.tar').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '23980e160773b52f7f6df9eb57bc63f1988c18cfbb114e4831192559dc66dcfe'
          with tarfile.open('/tmp/target.tar') as src:
              members=src.getmembers()
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  assert m.isfile() and not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  if name: pathlib.Path(name).unlink(missing_ok=True)
              for m in members:
                  p=pathlib.Path(m.name); p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(src.extractfile(m).read()); p.chmod(m.mode)
          PY
          git add -A
          test "$(git write-tree)" = c7fc8945483024f4bb2bb701a8934843058a5c6f
          git config user.name 'TabMail maintenance'
          git config user.email 'tabmail-maintenance@users.noreply.github.com'
          git commit -m 'refactor: separate company mail assets, lifecycle and workspaces'
          git push origin HEAD:refs/heads/$branch
          git log -1 --format='%H %T'

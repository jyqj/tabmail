name: R5 NEXT1010 PostgreSQL regressions
on:
  pull_request:
    branches:
      - main
      - integration/company-mail-r5-*
permissions:
  contents: read
concurrency:
  group: next1010-pg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-regressions:
    strategy:
      fail-fast: false
      matrix:
        case: [refresh-issuance, permission-audit, activation-sponsor, activation-errors]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabmail_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: tabmail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabmail_test -d tabmail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOSUMDB: sum.golang.org
      GODEBUG: asynctimerchan=0
      TABMAIL_TEST_DB_DSN: postgres://tabmail_test:disposable-test-password@localhost:5432/tabmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compare fixed baseline and exact candidate
        env:
          NEXT1010_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B scripts/run_r5_next1010_pg.py --candidate . \
            --expected-commit "$NEXT1010_EXPECTED_COMMIT" \
            --case "${{ matrix.case }}" --output "$RUNNER_TEMP/next1010-${{ matrix.case }}"
      - name: Preserve original execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next1010-${{ matrix.case }}
          path: ${{ runner.temp }}/next1010-${{ matrix.case }}
          if-no-files-found: error
          retention-days: 14

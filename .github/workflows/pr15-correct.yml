name: PR15 architecture regression corrections
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  correct:
    if: github.repository == 'jyqj/tabmail' && github.event.pull_request.number == 15 && github.event.pull_request.head.repo.full_name == 'jyqj/tabmail' && github.event.pull_request.head.ref == 'refactor/company-mail-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply reviewed corrections with exact output tree verification
        shell: bash
        run: |
          set -euo pipefail
          branch=refactor/company-mail-architecture
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = 815f09917c71310188b7670a5ff0f583fcc0e6d7
          python3 - <<'PY'
          import base64,zlib,pathlib
          data=''
          pathlib.Path('/tmp/correction.patch').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY
          git apply --check /tmp/correction.patch
          git apply /tmp/correction.patch
          rm .github/workflows/pr15-correct.yml
          git add -A
          test "$(git write-tree)" = e7b52ee04c715544a2b1bd450342838f0a98c2cd
          git config user.name 'TabMail maintenance'
          git config user.email 'tabmail-maintenance@users.noreply.github.com'
          git commit -m 'fix: preserve current content boundaries and validate architecture upgrades'
          git push origin HEAD:refs/heads/$branch
          git log -1 --format='%H %T'

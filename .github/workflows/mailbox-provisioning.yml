name: Mailbox provisioning with PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - integration/company-mail-r5-*
permissions:
  contents: read
concurrency:
  group: mailbox-provisioning-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mailbox-provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tabmail_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: tabmail_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tabmail_test -d tabmail_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      GOSUMDB: sum.golang.org
      GODEBUG: asynctimerchan=0
      TABMAIL_TEST_DB_DSN: postgres://tabmail_test:disposable-test-password@localhost:5432/tabmail_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fixed baseline and candidate mailbox provisioning regression
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/tabmail-mailbox-baseline" be3a6bf41daa198a39306c90fd03411e38a017d8
          python3 -B scripts/run_r5_mailbox_provisioning.py \
            --baseline "$RUNNER_TEMP/tabmail-mailbox-baseline" --candidate . \
            --output "$RUNNER_TEMP/tabmail-mailbox-evidence"
      - name: Retain both actual PostgreSQL executions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailbox-provisioning-evidence
          path: ${{ runner.temp }}/tabmail-mailbox-evidence
          if-no-files-found: error
          retention-days: 14

name: tabmail-prod

x-tabmail-env: &tabmail-env
  TABMAIL_MAILBOX_TOKEN_SECRET: "${TABMAIL_MAILBOX_TOKEN_SECRET:?set TABMAIL_MAILBOX_TOKEN_SECRET}"
  TABMAIL_JWT_SECRET: "${TABMAIL_JWT_SECRET:?set TABMAIL_JWT_SECRET}"
  TABMAIL_DB_DSN: "${TABMAIL_DB_DSN:?set TABMAIL_DB_DSN}"
  TABMAIL_REDIS_ADDR: "${TABMAIL_REDIS_ADDR:?set TABMAIL_REDIS_ADDR}"
  TABMAIL_REDIS_PASSWORD: "${TABMAIL_REDIS_PASSWORD:?set TABMAIL_REDIS_PASSWORD}"
  TABMAIL_SMTP_DOMAIN: "${TABMAIL_SMTP_DOMAIN:?set TABMAIL_SMTP_DOMAIN}"
  TABMAIL_LOGLEVEL: "${TABMAIL_LOGLEVEL:-info}"
  TABMAIL_HTTP_ALLOWED_ORIGINS: "${TABMAIL_HTTP_ALLOWED_ORIGINS:?set TABMAIL_HTTP_ALLOWED_ORIGINS}"
  TABMAIL_HTTP_TRUSTED_PROXIES: "${TABMAIL_HTTP_TRUSTED_PROXIES:?set TABMAIL_HTTP_TRUSTED_PROXIES}"
  TABMAIL_AUTO_CREATE_ROUTE_RPM: "${TABMAIL_AUTO_CREATE_ROUTE_RPM:-60}"
  TABMAIL_AUTO_CREATE_TENANT_RPM: "${TABMAIL_AUTO_CREATE_TENANT_RPM:-300}"
  TABMAIL_HTTP_PUBLIC_IP_RPM: "${TABMAIL_HTTP_PUBLIC_IP_RPM:-120}"
  TABMAIL_HTTP_METRICS_TOKEN: "${TABMAIL_HTTP_METRICS_TOKEN:-}"
  TABMAIL_HTTP_COOKIE_SECURE: "${TABMAIL_HTTP_COOKIE_SECURE:-true}"
  TABMAIL_COMPANY_ONLY: "true"
  TABMAIL_MAILBOXNAMING: "full"
  TABMAIL_OBJECT_STORE: "${TABMAIL_OBJECT_STORE:-fs}"
  TABMAIL_S3_ENDPOINT: "${TABMAIL_S3_ENDPOINT:-}"
  TABMAIL_S3_REGION: "${TABMAIL_S3_REGION:-us-east-1}"
  TABMAIL_S3_BUCKET: "${TABMAIL_S3_BUCKET:-}"
  TABMAIL_S3_ACCESS_KEY: "${TABMAIL_S3_ACCESS_KEY:-}"
  TABMAIL_S3_SECRET_KEY: "${TABMAIL_S3_SECRET_KEY:-}"
  TABMAIL_S3_USE_TLS: "${TABMAIL_S3_USE_TLS:-true}"
  TABMAIL_S3_FORCE_PATH_STYLE: "${TABMAIL_S3_FORCE_PATH_STYLE:-true}"
  TABMAIL_OPEN_REGISTRATION: "${TABMAIL_OPEN_REGISTRATION:-false}"
  TABMAIL_INGEST_DURABLE: "${TABMAIL_INGEST_DURABLE:-true}"
  TABMAIL_BOOTSTRAP_ADMIN_EMAIL: "${TABMAIL_BOOTSTRAP_ADMIN_EMAIL:-}"
  TABMAIL_BOOTSTRAP_ADMIN_PASS: "${TABMAIL_BOOTSTRAP_ADMIN_PASS:-}"
  TABMAIL_OUTBOUND_ENABLED: "${TABMAIL_OUTBOUND_ENABLED:-true}"
  TABMAIL_OUTBOUND_MODE: "${TABMAIL_OUTBOUND_MODE:-relay}"
  TABMAIL_OUTBOUND_RELAY_HOST: "${TABMAIL_OUTBOUND_RELAY_HOST:-}"
  TABMAIL_OUTBOUND_RELAY_PORT: "${TABMAIL_OUTBOUND_RELAY_PORT:-587}"
  TABMAIL_OUTBOUND_RELAY_USER: "${TABMAIL_OUTBOUND_RELAY_USER:-}"
  TABMAIL_OUTBOUND_RELAY_PASS: "${TABMAIL_OUTBOUND_RELAY_PASS:-}"
  TABMAIL_OUTBOUND_RELAY_TLS: "${TABMAIL_OUTBOUND_RELAY_TLS:-starttls}"
  TABMAIL_OUTBOUND_FROM_DOMAIN: "${TABMAIL_OUTBOUND_FROM_DOMAIN:-}"
  TABMAIL_OUTBOUND_DKIM_SIGN: "${TABMAIL_OUTBOUND_DKIM_SIGN:-true}"
  TABMAIL_OUTBOUND_DKIM_FAIL_POLICY: "${TABMAIL_OUTBOUND_DKIM_FAIL_POLICY:-fail_closed}"
  TABMAIL_OUTBOUND_REQUIRE_TLS: "${TABMAIL_OUTBOUND_REQUIRE_TLS:-true}"

services:
  tabmail-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      <<: *tabmail-env
      TABMAIL_ROLE: "api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mail_data:/data
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s

  tabmail-smtp:
    build: .
    ports:
      - "2525:2525"
    environment:
      <<: *tabmail-env
      TABMAIL_ROLE: "smtp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mail_data:/data
    restart: unless-stopped

  tabmail-worker:
    build: .
    environment:
      <<: *tabmail-env
      TABMAIL_ROLE: "worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mail_data:/data
    restart: unless-stopped

  tabmail-retention:
    build: .
    environment:
      <<: *tabmail-env
      TABMAIL_ROLE: "retention"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mail_data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        INTERNAL_API_URL: "http://tabmail-api:8080"
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: "http://tabmail-api:8080"
    depends_on:
      tabmail-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:?set POSTGRES_DB}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDISCLI_AUTH: "${TABMAIL_REDIS_PASSWORD:?set TABMAIL_REDIS_PASSWORD}"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${TABMAIL_REDIS_PASSWORD:?set TABMAIL_REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pg_data:
  mail_data:
